openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
servers:
  - url: /api
paths:
  /student/placement/{mode}:
    parameters:
      - { name: mode, in: path, required: true, schema: { $ref: "#/components/schemas/Mode" } }
    get:
      operationId: getWarmup
      responses:
        "200":
          description: Owned warm-up state with no answer keys or result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarmupState" }
    post:
      operationId: warmupEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarmupEventInput" }
      responses:
        "200":
          description: Persisted warm-up state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarmupState" }
  /student/placement/{mode}/{attemptId}/{itemId}/audio:
    get:
      operationId: getWarmupAudio
      parameters:
        - { name: mode, in: path, required: true, schema: { $ref: "#/components/schemas/Mode" } }
        - { name: attemptId, in: path, required: true, schema: { type: integer } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authorized Arabic prompt only
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
  /adult/students/{id}/placement:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getStartingPoint
      responses:
        "200":
          description: Owned adult placement summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartingPoint" }
    post:
      operationId: redoWarmup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlacementRedoInput" }
      responses:
        "200":
          description: A new warm-up is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /adult/language:
    patch:
      operationId: updateAdultLanguage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdultLanguageInput" }
      responses:
        "200":
          description: Updated adult language preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Adult" }
        "403": { description: Adult session required }
  /adult/demo/compare:
    post:
      operationId: compareDemoModes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoQuestion" }
      responses:
        "200":
          description: One newline-delimited JSON event per completed mode; each event is independent.
          content:
            application/x-ndjson:
              schema: { type: string }
        "403": { description: Adult session required }
  /adult/demo/audio:
    post:
      operationId: speakDemoReply
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoSpeech" }
      responses:
        "200":
          description: Temporary speech; never persisted or cached
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "403": { description: Adult session required }
  /adult/students/{id}/insights/refresh:
    post:
      operationId: refreshStudentInsights
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfile" }
        "403": { description: Not your student }
        "503": { description: Insights unavailable; previous insights retained }
  /students/{id}/chats/{chatId}:
    get:
      operationId: getAdultChat
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: chatId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Read-only transcript
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatHistory" }
        "403": { description: Not your student or chat }
  /adult/students/{id}/messages/{messageId}/audio:
    get:
      operationId: getAdultMessageAudio
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: messageId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Private cached speech
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "403": { description: Not your dyslexia student or message }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /adult/session:
    get:
      operationId: getAdultSession
      responses:
        "200":
          description: Adult session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdultSession" }
  /adult/signup:
    post:
      operationId: signupAdult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdultSignup" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Adult" }
  /adult/login:
    post:
      operationId: loginAdult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdultLogin" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Adult" }
  /adult/logout:
    post:
      operationId: logoutAdult
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /students:
    get:
      operationId: listStudents
      responses:
        "200":
          description: Owned students
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Student" }
    post:
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
  /students/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getStudent
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfile" }
    patch:
      operationId: updateStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
  /student/login:
    post:
      operationId: loginStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentLogin" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
  /student/session:
    get:
      operationId: getStudentSession
      responses:
        "200":
          description: Student session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSession" }
  /student/logout:
    post:
      operationId: logoutStudent
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
  /student/modes/{mode}:
    get:
      operationId: getStudentMode
      parameters:
        - name: mode
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Mode" }
      responses:
        "200":
          description: Authorized mode home
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfile" }
  /student/chats:
    get:
      operationId: listStudentChats
      responses:
        "200":
          description: Owned chats, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentChat" }
    post:
      operationId: createStudentChat
      responses:
        "201":
          description: New chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentChat" }
  /student/chats/{id}/subject:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateChatSubject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatSubjectInput" }
      responses:
        "200":
          description: Updated owned chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentChat" }
  /student/chats/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: listStudentMessages
      responses:
        "200":
          description: Owned chat and its messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatHistory" }
    post:
      operationId: sendStudentMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "200":
          description: Saved student message, AI reply and updated chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatExchange" }
  /student/voice/transcribe:
    post:
      parameters:
        - name: X-Lumi-Demo
          in: header
          required: false
          description: Set to 1 only for adult demo transcription; requires an adult session.
          schema: { type: string, enum: ["1"] }
      operationId: transcribeStudentVoice
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/VoiceRecording" }
      responses:
        "200":
          description: Arabic transcription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceTranscript" }
  /student/messages/{id}/audio:
    get:
      operationId: getStudentMessageAudio
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Private cached speech
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
components:
  schemas:
    PlacementRedoInput:
      type: object
      properties:
        demoReset: { type: boolean, default: false }
    StartingPoint:
      type: object
      required: [result, pending, demo]
      properties:
        pending: { type: boolean }
        demo: { type: boolean }
        result:
          anyOf:
            - { $ref: "#/components/schemas/PlacementResult" }
            - { type: "null" }
    PlacementResult:
      type: object
      required: [test, version, completed_at, levels, band, flags, interests, preferences, signals]
      properties:
        test: { type: string, enum: [dyslexia, learning_difficulties, autism] }
        version: { type: integer }
        completed_at: { type: string }
        levels: { type: object, additionalProperties: { type: integer } }
        band: { type: string }
        flags: { type: array, items: { type: string } }
        interests: { type: array, items: { type: string } }
        preferences: { type: object, additionalProperties: {} }
        signals: { type: object, additionalProperties: { type: number } }
        favorite_thing: { type: string }
        error_patterns: { type: array, items: { type: string } }
        step: { type: integer }
    WarmupEventInput:
      type: object
      required: [attemptId, eventId, action]
      properties:
        attemptId: { type: integer, minimum: 1 }
        eventId: { type: string, minLength: 8, maxLength: 80 }
        itemId: { type: string }
        action: { type: string, enum: [answer, next, audio, break, resume, schedule, preview_done, tap, sound] }
        picked: { type: array, maxItems: 6, items: { type: string, maxLength: 500 } }
        skipped: { type: boolean }
        responseMs: { type: integer, minimum: 0, maximum: 600000 }
        replay: { type: boolean }
        sound: { type: boolean }
    WarmupState:
      type: object
      required: [id, mode, required, stage, currentIndex, sections, sectionIndex, partItemIndex, feedback, selected, sound, audioPlayed, replays, taps, sequenceCount]
      properties:
        id: { type: integer }
        mode: { $ref: "#/components/schemas/Mode" }
        required: { type: boolean }
        currentIndex: { type: integer }
        stage: { type: string, enum: [schedule, question, preview, answered, paused, done] }
        sections:
          type: array
          items: { $ref: "#/components/schemas/WarmupSection" }
        sectionIndex: { type: integer }
        partItemIndex: { type: integer }
        feedback: { type: string }
        selected: { type: array, items: { type: string } }
        sound: { type: boolean }
        audioPlayed: { type: boolean }
        replays: { type: integer }
        taps: { type: array, items: { type: string } }
        sequenceCount: { type: integer }
        item:
          anyOf:
            - { $ref: "#/components/schemas/WarmupItem" }
            - { type: "null" }
    WarmupSection:
      type: object
      required: [id, title_ar, count]
      properties:
        id: { type: string }
        title_ar: { type: string }
        count: { type: integer }
    WarmupItem:
      type: object
      required: [id, type, prompt_ar, options, audio, section]
      properties:
        id: { type: string }
        type: { type: string }
        prompt_ar: { type: string }
        tts_ar: { type: string }
        audio: { type: string }
        section: { type: string }
        shown: { type: string }
        passage: { type: string }
        passage_audio: { type: boolean }
        example: { type: string }
        sequence: { type: array, items: { type: string } }
        options:
          type: array
          items: { $ref: "#/components/schemas/WarmupOption" }
    WarmupOption:
      type: object
      required: [id]
      properties:
        id: { type: string }
        label_ar: { type: string }
        emoji: { type: string }
        size: { type: integer }
    VoiceRecording:
      type: object
      required: [audio]
      properties:
        audio: { type: string, format: binary }
    VoiceTranscript:
      type: object
      required: [text]
      properties:
        text: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Success:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    Mode:
      type: string
      enum: [dyslexia, learning, autism]
    Adult:
      type: object
      required: [id, name, email, role, school, language]
      properties:
        language: { type: string, enum: [ar, en] }
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [teacher, parent] }
        school: { type: [string, "null"] }
    AdultLanguageInput:
      type: object
      required: [language]
      properties:
        language: { type: string, enum: [ar, en] }
    AdultSession:
      type: object
      required: [adult]
      properties:
        adult:
          anyOf:
            - { $ref: "#/components/schemas/Adult" }
            - { type: "null" }
    AdultLogin:
      type: object
      required: [email, password, role]
      properties:
        language: { type: string, enum: [ar, en] }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        role: { type: string, enum: [teacher, parent] }
    AdultSignup:
      type: object
      required: [name, email, password, role]
      properties:
        language: { type: string, enum: [ar, en] }
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        role: { type: string, enum: [teacher, parent] }
        school: { type: string, maxLength: 200 }
    Student:
      type: object
      required: [id, name, username, conditions, assessmentConfirmed, interests, language]
      properties:
        language: { type: string, enum: [ar, en] }
        interests: { $ref: "#/components/schemas/Interests" }
        id: { type: integer }
        name: { type: string }
        username: { type: string }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/Mode" }
        assessmentConfirmed: { type: boolean }
    StudentInput:
      type: object
      required: [name, username, pin, mode]
      properties:
        language: { type: string, enum: [ar, en] }
        interests: { $ref: "#/components/schemas/Interests" }
        name: { type: string, minLength: 1, maxLength: 100 }
        username: { type: string, minLength: 3, maxLength: 40, pattern: "^[a-zA-Z0-9_]+$" }
        pin: { type: string, pattern: "^[0-9]{4}$" }
        mode: { $ref: "#/components/schemas/Mode" }
        assessmentConfirmed: { type: boolean }
    StudentUpdate:
      type: object
      minProperties: 1
      properties:
        language: { type: string, enum: [ar, en] }
        mode: { $ref: "#/components/schemas/Mode" }
        interests: { $ref: "#/components/schemas/Interests" }
    Interests:
      type: array
      maxItems: 5
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 40, pattern: "\\S" }
    DemoQuestion:
      type: object
      required: [question]
      properties:
        language: { type: string, enum: [ar, en] }
        question: { type: string, minLength: 1, maxLength: 2000 }
        interests: { $ref: "#/components/schemas/Interests" }
    DemoSpeech:
      type: object
      required: [text]
      properties:
        language: { type: string, enum: [ar, en] }
        text: { type: string, minLength: 1, maxLength: 800 }
    DemoModeResult:
      type: object
      required: [mode, status]
      properties:
        mode: { $ref: "#/components/schemas/Mode" }
        status: { type: string, enum: [success, error] }
        content: { type: string }
        error: { type: string }
    StudentLogin:
      type: object
      required: [username, pin]
      properties:
        language: { type: string, enum: [ar, en] }
        username: { type: string, minLength: 1, maxLength: 40 }
        pin: { type: string, pattern: "^[0-9]{4}$" }
    StudentSession:
      type: object
      required: [student]
      properties:
        student:
          anyOf:
            - { $ref: "#/components/schemas/Student" }
            - { type: "null" }
    Insight:
      type: object
      required: [id, type, text, evidence, sourceChatId]
      properties:
        source: { type: string, enum: [session, placement] }
        textAr: { type: [string, "null"] }
        textEn: { type: [string, "null"] }
        evidenceAr: { type: [string, "null"] }
        evidenceEn: { type: [string, "null"] }
        id: { type: integer }
        type: { type: string, enum: [strength, weakness, need] }
        text: { type: string }
        evidence: { type: [string, "null"] }
        sourceChatId: { type: [integer, "null"] }
    Chat:
      type: object
      required: [id, title, createdAt, icon, messageCount]
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string }
        icon: { type: [string, "null"] }
        messageCount: { type: integer }
    StudentChat:
      type: object
      required: [id, title, icon, createdAt, subject]
      properties:
        subject: { $ref: "#/components/schemas/ChatSubject" }
        id: { type: integer }
        title: { type: string }
        icon: { type: [string, "null"] }
        createdAt: { type: string }
    ChatMessage:
      type: object
      required: [id, chatId, role, content, audioUrl, createdAt]
      properties:
        spokenContent: { type: [string, "null"] }
        presentation: { type: [object, "null"], additionalProperties: {} }
        id: { type: integer }
        chatId: { type: integer }
        role: { type: string, enum: [student, ai] }
        content: { type: string }
        audioUrl: { type: [string, "null"] }
        createdAt: { type: string }
    ChatSubject:
      type: string
      enum: [math, science, arabic, english, general]
    ChatSubjectInput:
      type: object
      required: [subject]
      properties:
        subject: { $ref: "#/components/schemas/ChatSubject" }
    MessageInput:
      type: object
      required: [content]
      properties:
        practiceMessageId: { type: integer, minimum: 1 }
        practiceChoiceId: { type: string, maxLength: 80 }
        content: { type: string, minLength: 1, maxLength: 2000 }
        retryMessageId: { type: integer, minimum: 1 }
    ChatHistory:
      type: object
      required: [chat, messages]
      properties:
        chat: { $ref: "#/components/schemas/StudentChat" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
    ChatExchange:
      type: object
      required: [chat, studentMessage, reply]
      properties:
        chat: { $ref: "#/components/schemas/StudentChat" }
        studentMessage: { $ref: "#/components/schemas/ChatMessage" }
        reply: { $ref: "#/components/schemas/ChatMessage" }
    StudentProfile:
      type: object
      required: [student, insights, chats, stats, insightsUpdatedAt]
      properties:
        tutorPreferences: { type: object, additionalProperties: {} }
        insightsUpdatedAt: { type: [string, "null"] }
        stats:
          type: object
          required: [sessions, messages, lastActive]
          properties:
            sessions: { type: integer }
            messages: { type: integer }
            lastActive: { type: [string, "null"] }
        student: { $ref: "#/components/schemas/Student" }
        insights:
          type: array
          items: { $ref: "#/components/schemas/Insight" }
        chats:
          type: array
          items: { $ref: "#/components/schemas/Chat" }
