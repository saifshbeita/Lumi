format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: token
    token: background
theme:
  colors:
    background: "#FAF9F4"
    foreground: "#2D4059"
    accent: "#F3D982"
    surface: "#E5EEF5"
    white: "#FFFFFF"
  fonts:
    display: Fraunces
    body: Readex Pro
assets:
  full:
    src: images/lumi-full.png
  head:
    src: images/lumi-head.png
elements:
  - id: footer-rule
    type: shape
    frame:
      x: 120
      y: 994
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: surface
  - id: folio
    type: text
    frame:
      x: 1670
      y: 1010
      width: 140
      height: 42
    body:
      paragraphs:
        - runs:
            - text: 02 / 09
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.4
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 0
  - id: brand-head
    type: image
    assetId: head
    fit: contain
    frame:
      x: 1740
      y: 60
      width: 80
      height: 80
  - id: headline
    type: text
    frame:
      x: 120
      y: 135
      width: 1640
      height: 190
    body:
      paragraphs:
        - runs:
            - text: Reading should not block learning.
          defaultRunStyle:
            font:
              kind: token
              token: display
            sizePt: 38
            weight: 600
            color:
              kind: token
              token: foreground
          lineHeight: 1.1
          spaceAfterPt: 0
  - id: stat-field
    type: shape
    frame:
      x: 120
      y: 340
      width: 580
      height: 550
    geometry:
      kind: preset
      preset: roundRect
      cornerRadius: 24
    fill:
      kind: solid
      color:
        kind: token
        token: accent
  - id: stat
    type: text
    frame:
      x: 165
      y: 410
      width: 500
      height: 265
    body:
      paragraphs:
        - runs:
            - text: 11%
          defaultRunStyle:
            font:
              kind: token
              token: display
            sizePt: 104
            weight: 600
            color:
              kind: token
              token: foreground
          lineHeight: 1.1
          spaceAfterPt: 0
  - id: stat-context
    type: text
    frame:
      x: 165
      y: 650
      width: 475
      height: 245
    body:
      paragraphs:
        - runs:
            - text: pooled dyslexia prevalence among Arab primary-school children aged 6–13.
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 21
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 0
  - id: need
    type: text
    frame:
      x: 800
      y: 415
      width: 960
      height: 430
    body:
      paragraphs:
        - runs:
            - text: 18 studies. 30,243 participants. Estimates vary across countries.
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 25
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 10
        - runs:
            - text: Children need accessible explanations; adults need visibility into
                learning.
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 25
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 10
  - id: source
    type: text
    frame:
      x: 120
      y: 925
      width: 1650
      height: 55
    body:
      paragraphs:
        - runs:
            - text: "Source: Aldakhil et al., 2024, systematic review and meta-analysis."
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.4
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 0
