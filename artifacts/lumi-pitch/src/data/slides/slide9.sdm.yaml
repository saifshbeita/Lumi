format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: token
    token: foreground
theme:
  colors:
    background: "#FAF9F4"
    foreground: "#2D4059"
    accent: "#F3D982"
    surface: "#E5EEF5"
    white: "#FFFFFF"
  fonts:
    display: Fraunces
    body: Readex Pro
assets:
  full:
    src: images/lumi-full.png
  head:
    src: images/lumi-head.png
elements:
  - id: closing-field
    type: shape
    frame:
      x: 1310
      y: 0
      width: 610
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
  - id: footer-rule
    type: shape
    frame:
      x: 120
      y: 994
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
  - id: folio
    type: text
    frame:
      x: 1670
      y: 1010
      width: 140
      height: 42
    body:
      paragraphs:
        - runs:
            - text: 09 / 09
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.4
            weight: 400
            color:
              kind: token
              token: background
          lineHeight: 1.25
          spaceAfterPt: 0
  - id: brand-head
    type: image
    assetId: head
    fit: contain
    frame:
      x: 1740
      y: 60
      width: 80
      height: 80
  - id: headline
    type: text
    frame:
      x: 120
      y: 140
      width: 1150
      height: 375
    body:
      paragraphs:
        - runs:
            - text: Help us turn interest into evidence.
          defaultRunStyle:
            font:
              kind: token
              token: display
            sizePt: 50
            weight: 600
            color:
              kind: token
              token: background
          lineHeight: 1.1
          spaceAfterPt: 0
  - id: ask
    type: text
    frame:
      x: 120
      y: 535
      width: 1080
      height: 280
    body:
      paragraphs:
        - runs:
            - text: Seeking pilot schools, special-education partners and parent communities.
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: background
          lineHeight: 1.25
          spaceAfterPt: 10
        - runs:
            - text: "Next milestone: a supervised pilot measuring usability, repeat use and
                learning support."
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: background
          lineHeight: 1.25
          spaceAfterPt: 10
  - id: team
    type: text
    frame:
      x: 120
      y: 850
      width: 1130
      height: 75
    body:
      paragraphs:
        - runs:
            - text: Hala Shbeita · Yousef Smreen · Saif Shbeita
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 20
            weight: 400
            color:
              kind: token
              token: background
          lineHeight: 1.25
          spaceAfterPt: 0
  - id: instagram
    type: text
    frame:
      x: 120
      y: 930
      width: 1100
      height: 65
    body:
      paragraphs:
        - runs:
            - text: instagram.com/lumi.mena
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: accent
          lineHeight: 1.25
          spaceAfterPt: 0
  - id: closing-mascot
    type: image
    assetId: full
    fit: contain
    frame:
      x: 1320
      y: 120
      width: 585
      height: 735
  - id: tagline
    type: text
    frame:
      x: 1370
      y: 865
      width: 460
      height: 130
    body:
      paragraphs:
        - runs:
            - text: Lumi — Every mind learns its own way.
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 0
