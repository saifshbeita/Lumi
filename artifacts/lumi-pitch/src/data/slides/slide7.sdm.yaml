format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: token
    token: background
theme:
  colors:
    background: "#FAF9F4"
    foreground: "#2D4059"
    accent: "#F3D982"
    surface: "#E5EEF5"
    white: "#FFFFFF"
  fonts:
    display: Fraunces
    body: Readex Pro
assets:
  full:
    src: images/lumi-full.png
  head:
    src: images/lumi-head.png
elements:
  - id: footer-rule
    type: shape
    frame:
      x: 120
      y: 994
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: surface
  - id: folio
    type: text
    frame:
      x: 1670
      y: 1010
      width: 140
      height: 42
    body:
      paragraphs:
        - runs:
            - text: 07 / 09
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.4
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 0
  - id: brand-head
    type: image
    assetId: head
    fit: contain
    frame:
      x: 1740
      y: 60
      width: 80
      height: 80
  - id: headline
    type: text
    frame:
      x: 120
      y: 135
      width: 1640
      height: 190
    body:
      paragraphs:
        - runs:
            - text: Schools first. Families alongside.
          defaultRunStyle:
            font:
              kind: token
              token: display
            sizePt: 38
            weight: 600
            color:
              kind: token
              token: foreground
          lineHeight: 1.1
          spaceAfterPt: 0
  - id: school-field
    type: shape
    frame:
      x: 120
      y: 345
      width: 800
      height: 385
    geometry:
      kind: preset
      preset: roundRect
      cornerRadius: 24
    fill:
      kind: solid
      color:
        kind: token
        token: accent
  - id: family-field
    type: shape
    frame:
      x: 970
      y: 345
      width: 830
      height: 385
    geometry:
      kind: preset
      preset: roundRect
      cornerRadius: 24
    fill:
      kind: solid
      color:
        kind: token
        token: surface
  - id: school
    type: text
    frame:
      x: 175
      y: 390
      width: 690
      height: 315
    body:
      paragraphs:
        - runs:
            - text: "Schools and centers: proposed $5 per student/month, billed annually."
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 28
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 0
  - id: family
    type: text
    frame:
      x: 1025
      y: 420
      width: 715
      height: 240
    body:
      paragraphs:
        - runs:
            - text: "Families: proposed $10 per child/month."
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 30
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 0
  - id: sales-path
    type: text
    frame:
      x: 120
      y: 795
      width: 1660
      height: 95
    body:
      paragraphs:
        - runs:
            - text: School-led pilots → paid renewals → parent referrals.
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 24
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 0
  - id: economics
    type: text
    frame:
      x: 120
      y: 920
      width: 1660
      height: 65
    body:
      paragraphs:
        - runs:
            - text: Validate willingness to pay, retention and AI/voice cost per active
                learner.
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 19
            weight: 400
            color:
              kind: token
              token: foreground
          lineHeight: 1.25
          spaceAfterPt: 0
