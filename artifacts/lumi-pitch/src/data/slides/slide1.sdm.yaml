format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: solid
  color:
    kind: token
    token: foreground
theme:
  colors:
    background: "#FAF9F4"
    foreground: "#2D4059"
    accent: "#F3D982"
    surface: "#E5EEF5"
    white: "#FFFFFF"
  fonts:
    display: Fraunces
    body: Readex Pro
assets:
  full:
    src: images/lumi-full.png
  head:
    src: images/lumi-head.png
elements:
  - id: mascot-field
    type: shape
    frame:
      x: 1200
      y: 0
      width: 720
      height: 1080
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
  - id: footer-rule
    type: shape
    frame:
      x: 120
      y: 994
      width: 1680
      height: 2
    geometry:
      kind: preset
      preset: rect
    fill:
      kind: solid
      color:
        kind: token
        token: accent
  - id: folio
    type: text
    frame:
      x: 1670
      y: 1010
      width: 140
      height: 42
    body:
      paragraphs:
        - runs:
            - text: 01 / 09
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 14.4
            weight: 400
            color:
              kind: token
              token: background
          lineHeight: 1.25
          spaceAfterPt: 0
  - id: brand-head
    type: image
    assetId: head
    fit: contain
    frame:
      x: 1740
      y: 60
      width: 80
      height: 80
  - id: headline
    type: text
    frame:
      x: 120
      y: 155
      width: 1060
      height: 410
    body:
      paragraphs:
        - runs:
            - text: The lesson is the same. The learner isn't.
          defaultRunStyle:
            font:
              kind: token
              token: display
            sizePt: 56
            weight: 600
            color:
              kind: token
              token: background
          lineHeight: 1.1
          spaceAfterPt: 0
  - id: intro
    type: text
    frame:
      x: 120
      y: 610
      width: 1030
      height: 360
    body:
      paragraphs:
        - runs:
            - text: Lumi — Every mind learns its own way.
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: background
          lineHeight: 1.25
          spaceAfterPt: 10
        - runs:
            - text: An AI learning companion in Arabic and English.
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: background
          lineHeight: 1.25
          spaceAfterPt: 10
        - runs:
            - text: For children who need a different way into learning.
          defaultRunStyle:
            font:
              kind: token
              token: body
            sizePt: 22
            weight: 400
            color:
              kind: token
              token: background
          lineHeight: 1.25
          spaceAfterPt: 10
  - id: mascot
    type: image
    assetId: full
    fit: contain
    frame:
      x: 1225
      y: 130
      width: 620
      height: 820
